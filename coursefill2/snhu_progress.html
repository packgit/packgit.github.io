<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Science A.S. - SNHU Progress</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      min-height: 100vh;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
      font-size: clamp(1.4rem, 5vw, 2rem);
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 6px;
    }

    .units-line {
      text-align: center;
      color: #1e3a8a;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .progress-table {
      max-width: 1200px;
      margin: 0 auto;
    }

    .progress-header,
    .course-entry {
      display: grid;
      grid-template-columns: minmax(220px, 2fr) minmax(0, 5fr);
      gap: 12px;
      align-items: start;
    }

    .progress-header {
      margin-bottom: 10px;
    }

    .header-course-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: #1e3a8a;
      padding: 8px 4px;
    }

    .header-values,
    .values-row {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .values-row {
      border: 2px solid #1e3a8a;
      border-radius: 12px;
      padding: 8px;
      background: #f8fafc;
    }

    .header-field-box,
    .field-box {
      border: 2px solid #1e3a8a;
      border-radius: 10px;
      padding: 8px 6px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.78rem;
      line-height: 1.2;
      word-break: break-word;
    }

    .header-field-box {
      background: #1e3a8a;
      color: #ffffff;
      font-weight: 700;
    }

    .field-box {
      background: #ffffff;
      color: #222;
    }

    .course-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #course-list .pending-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #e0f0ff;
      margin-bottom: 10px;
      border-radius: 8px;
      padding: 10px;
      overflow: hidden;
    }

    .course-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .course-card-row {
      display: flex;
      align-items: stretch;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
    }

    .pending-main {
      flex: 1;
      padding: 8px 12px;
      min-width: 0;
    }

    .pending-action {
      flex: 0 0 72px;
      background-color: #22c55e;
      display: flex;
      flex-direction: column;
    }

    .action-top, .action-bottom {
      flex: 1;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-top {
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .action-top.active, .action-bottom.active {
      background: rgba(255,255,255,0.15);
      font-size: 0.65rem;
    }

    .pending-expand {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border: 1px solid #f59e0b;
      border-radius: 6px;
    }

    .pending-expand-content {
      font-size: 0.8rem;
      color: #92400e;
      line-height: 1.2;
      padding: 6px 12px;
      font-weight: 500;
    }

    .course-name {
      font-weight: bold;
      display: block;
      font-size: 0.95rem;
    }

    .course-meta {
      color: #444;
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .pending-complete-bar {
      background: #1e3a8a;
      color: #ffffff;
      text-align: center;
      font-weight: 700;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
    }

    .error {
      color: #b00020;
      text-align: center;
    }


    .progress-summary-title {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e3a8a;
      text-align: center;
    }

    .progress-summary {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .summary-item {
      border: 2px solid #1e3a8a;
      border-radius: 12px;
      background: #ffffff;
      padding: 14px 16px;
      text-align: center;
    }

    .summary-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #222;
    }

    @media (max-width: 700px) {
  
    .progress-summary-title {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e3a8a;
      text-align: center;
    }

    .progress-summary {
        grid-template-columns: 1fr;
      }
    }



    @media (max-width: 900px) {
      .progress-header {
        display: none;
      }

      .course-entry {
        grid-template-columns: 1fr;
      }

      .values-row {
        grid-template-columns: 1fr 1fr;
      }

      .field-box::before {
        display: block;
        font-size: 0.65rem;
        font-weight: 700;
        color: #1e3a8a;
        margin-bottom: 4px;
      }

      .field-box[data-label="Units"]::before { content: "Units"; }
      .field-box[data-label="Amount Complete"]::before { content: "Amount Complete"; }
      .field-box[data-label="Date"]::before { content: "Date"; }
      .field-box[data-label="CourseSite"]::before { content: "CourseSite"; }
      .field-box[data-label="TransferCourseName"]::before { content: "TransferCourseName"; }
      .field-box[data-label="Processed"]::before { content: "Processed"; }
      .field-box[data-label="TimeCompletion"]::before { content: "TimeCompletion"; }
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to Course Dashboard</a>
  <h1>Computer Science A.S.</h1>
  <p class="subtitle">SNHU Progress</p>
  <p class="units-line">60 Units</p>

  <div class="progress-table">
    <div class="progress-header">
      <div class="header-course-title">Course</div>
      <div class="header-values">
        <div class="header-field-box">Units</div>
        <div class="header-field-box">Amount Complete</div>
        <div class="header-field-box">Date</div>
        <div class="header-field-box">CourseSite</div>
        <div class="header-field-box">TransferCourseName</div>
        <div class="header-field-box">Processed</div>
        <div class="header-field-box">TimeCompletion</div>
      </div>
    </div>

    <ul id="course-list" class="course-list"></ul>

    <h2 class="progress-summary-title">Overall Progress Summary</h2>
    <div class="progress-summary">
      <div class="summary-item">
        <div class="summary-label">Total Units</div>
        <div class="summary-value" id="total-units">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Total Cost</div>
        <div class="summary-value" id="total-cost">$0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Total Time</div>
        <div class="summary-value" id="total-time">0 months</div>
      </div>
    </div>
  </div>

  <div class="error" id="load-error"></div>

  <script>
    let pendingCourses = [];
    let activeCostButtons = new Set();
    let activeLengthButtons = new Set();

    function formatCourseMeta(units, course) {
      const college = course.college || "n/a";
      const transferoption = course.transferoption;
      const transferText = transferoption && transferoption !== "none"
        ? ` with ${transferoption}`
        : "";
      return `Units: ${units} · College: ${college}${transferText}`;
    }

    function isCourseFullyComplete(course) {
      return course.completed === true || course.amountComplete === 100;
    }

    function getCourseCost(course) {
      if (!course || isCourseFullyComplete(course)) return 0;
      if (course.cost == null) return 0;
      const cost = Number(course.cost);
      const transferoption = course.transferoption;
      if (transferoption && transferoption !== "none") {
        const units = Number(course.unitsdone) || 0;
        return cost * units;
      }
      return cost;
    }

    function formatAmountComplete(value) {
      if (value == null || value === "") return "";
      return `${Number(value)}%`;
    }

    function formatTimeCompletion(months) {
      if (months == null || months === "") return "";
      const n = Number(months);
      if (Number.isNaN(n)) return "";
      return n === 1 ? "1 month" : `${n} months`;
    }

    function formatProcessed(value) {
      if (!value || value === "None") return "";
      return value;
    }

    function createFieldBox(label, value) {
      const box = document.createElement("div");
      box.className = "field-box";
      box.dataset.label = label;
      box.textContent = value || "";
      return box;
    }


    function parseCourseMonths(course) {
      if (course.timeCompletion != null && course.timeCompletion !== "") {
        return Number(course.timeCompletion) || 0;
      }
      const lengthStr = (course.length || "").toString().toLowerCase();
      const match = lengthStr.match(/(\d+)\s*(months?|mo)/i);
      return match ? parseInt(match[1], 10) : 0;
    }

    function updateSummaryTotals() {
      let totalUnits = 0;
      let totalCost = 0;
      let totalMonths = 0;

      activeCostButtons.forEach((index) => {
        const course = pendingCourses[index];
        if (!course) return;
        totalCost += getCourseCost(course);
        totalUnits += Number(course.unitsdone) || 0;
      });

      activeLengthButtons.forEach((index) => {
        const course = pendingCourses[index];
        if (!course) return;
        totalMonths += parseCourseMonths(course);
      });

      document.getElementById("total-units").textContent = totalUnits;
      document.getElementById("total-cost").textContent = `$${totalCost.toLocaleString()}`;
      document.getElementById("total-time").textContent = formatTimeCompletion(totalMonths) || "0 months";
    }

    function renderValuesRow(course) {
      const row = document.createElement("div");
      row.className = "values-row";

      row.appendChild(createFieldBox("Units", course.unitsdone != null ? course.unitsdone : ""));
      row.appendChild(createFieldBox("Amount Complete", formatAmountComplete(course.amountComplete)));
      row.appendChild(createFieldBox("Date", course.date || ""));
      row.appendChild(createFieldBox("CourseSite", course.courseSite || ""));
      row.appendChild(createFieldBox("TransferCourseName", course.transferCourseName || ""));
      row.appendChild(createFieldBox("Processed", formatProcessed(course.processed)));
      row.appendChild(createFieldBox("TimeCompletion", formatTimeCompletion(course.timeCompletion)));

      return row;
    }

    function renderCourses(courses) {
      const ul = document.getElementById("course-list");
      ul.innerHTML = "";
      pendingCourses = courses;
      activeCostButtons.clear();
      activeLengthButtons.clear();

      courses.forEach((course, index) => {
        const li = document.createElement("li");
        li.className = "pending-item";

        const entry = document.createElement("div");
        entry.className = "course-entry";

        const infoCol = document.createElement("div");
        infoCol.className = "course-info";

        const cardRow = document.createElement("div");
        cardRow.className = "course-card-row";

        const mainDiv = document.createElement("div");
        mainDiv.className = "pending-main";

        const nameSpan = document.createElement("span");
        nameSpan.className = "course-name";
        nameSpan.textContent = course.coursename || "Untitled course";

        const metaDiv = document.createElement("div");
        metaDiv.className = "course-meta";
        const units = course.unitsdone != null ? course.unitsdone : "?";
        metaDiv.textContent = formatCourseMeta(units, course);

        mainDiv.appendChild(nameSpan);
        mainDiv.appendChild(metaDiv);

        const actionDiv = document.createElement("div");
        actionDiv.className = "pending-action";

        const costBtn = document.createElement("button");
        costBtn.className = "action-top";
        costBtn.textContent = "Cost";
        costBtn.dataset.courseIndex = index;
        costBtn.dataset.type = "cost";

        const lengthBtn = document.createElement("button");
        lengthBtn.className = "action-bottom";
        lengthBtn.textContent = "Length";
        lengthBtn.dataset.courseIndex = index;
        lengthBtn.dataset.type = "length";

        actionDiv.appendChild(costBtn);
        actionDiv.appendChild(lengthBtn);

        if (isCourseFullyComplete(course)) {
          costBtn.textContent = `$${getCourseCost(course).toLocaleString()}`;
          costBtn.classList.add("active");
          activeCostButtons.add(index);

          const lengthText = course.length || course.duration || course.hours || "TBD";
          lengthBtn.textContent = lengthText;
          lengthBtn.classList.add("active");
          activeLengthButtons.add(index);
        }

        cardRow.appendChild(mainDiv);
        cardRow.appendChild(actionDiv);
        infoCol.appendChild(cardRow);

        const expandDiv = document.createElement("div");
        expandDiv.className = "pending-expand";
        const expandContent = document.createElement("div");
        expandContent.className = "pending-expand-content";
        expandContent.textContent = `More info: ${course.coursename || "Pending course"} - ${course.college || "N/A"} • Units: ${course.unitsdone || "?"}`;
        expandDiv.appendChild(expandContent);
        infoCol.appendChild(expandDiv);

        entry.appendChild(infoCol);
        entry.appendChild(renderValuesRow(course));
        li.appendChild(entry);

        if (isCourseFullyComplete(course)) {
          const completeBar = document.createElement("div");
          completeBar.className = "pending-complete-bar";
          completeBar.textContent = "Complete";
          li.appendChild(completeBar);
        }

        ul.appendChild(li);
      });

      attachSplitButtonListeners();
      updateSummaryTotals();
    }

    function handleSplitButtonClick(e) {
      const btn = e.currentTarget;
      const index = parseInt(btn.dataset.courseIndex, 10);
      const type = btn.dataset.type;
      const course = pendingCourses[index];

      if (!course) return;

      if (type === "cost") {
        if (btn.classList.contains("active")) {
          btn.textContent = "Cost";
          btn.classList.remove("active");
          activeCostButtons.delete(index);
        } else {
          const cost = `$${getCourseCost(course).toLocaleString()}`;
          btn.textContent = cost;
          btn.classList.add("active");
          activeCostButtons.add(index);
        }
        updateSummaryTotals();
      } else if (type === "length") {
        if (btn.classList.contains("active")) {
          btn.textContent = "Length";
          btn.classList.remove("active");
          activeLengthButtons.delete(index);
        } else {
          const length = course.length || course.duration || course.hours || "TBD";
          btn.textContent = length;
          btn.classList.add("active");
          activeLengthButtons.add(index);
        }
        updateSummaryTotals();
      }
    }

    function attachSplitButtonListeners() {
      document.querySelectorAll(".action-top").forEach((btn) => {
        btn.addEventListener("click", handleSplitButtonClick);
      });
      document.querySelectorAll(".action-bottom").forEach((btn) => {
        btn.addEventListener("click", handleSplitButtonClick);
      });
    }

    fetch("pending_snhu.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((courses) => {
        renderCourses(courses);
      })
      .catch((err) => {
        document.getElementById("load-error").textContent =
          `Could not load SNHU course data (${err.message})`;
      });
  </script>
</body>
</html>
