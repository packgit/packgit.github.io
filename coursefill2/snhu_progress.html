<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.S. SNHU Progress</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      min-height: 100vh;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
      font-size: clamp(1.4rem, 5vw, 2rem);
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .course-list {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 1200px;
    }

    .progress-table-header,
    .progress-fields {
      display: grid;
      grid-template-columns: 2fr 0.6fr 1fr 0.9fr 1fr 0.8fr 1fr;
      gap: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
    }

    .progress-table-header {
      background: #1e3a8a;
      color: #ffffff;
      font-weight: 700;
      border-radius: 6px 6px 0 0;
      margin-bottom: 0;
    }

    .progress-fields {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-top: none;
      color: #222;
    }

    .progress-fields .field-label {
      display: none;
    }

    #course-list .pending-item {
      display: flex;
      flex-direction: column;
      gap: 0;
      background-color: #e0f0ff;
      margin-bottom: 6px;
      border-radius: 4px;
      overflow: hidden;
    }

    .pending-main-row {
      display: flex;
      align-items: stretch;
      width: 100%;
    }

    .pending-main {
      flex: 1;
      padding: 8px 12px;
    }

    .pending-action {
      flex: 0 0 20%;
      background-color: #22c55e;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .action-top, .action-bottom {
      flex: 1;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      z-index: 1;
    }

    .action-top {
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .action-top.active, .action-bottom.active {
      background: rgba(255,255,255,0.15);
      font-size: 0.65rem;
    }

    .pending-expand {
      max-height: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border-top: 2px solid #f59e0b;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.4s ease;
      width: 100%;
    }

    .pending-expand.open {
      max-height: 50px;
    }

    .pending-expand-content {
      font-size: 0.8rem;
      color: #92400e;
      line-height: 1.2;
      padding: 6px 12px;
      font-weight: 500;
      box-sizing: border-box;
    }

    .course-name {
      font-weight: bold;
      display: block;
      font-size: 0.95rem;
    }

    .course-meta {
      color: #444;
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .pending-complete-bar {
      background: #1e3a8a;
      color: #ffffff;
      text-align: center;
      font-weight: 700;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .error {
      color: #b00020;
      text-align: center;
    }

    @media (max-width: 768px) {
      .progress-table-header {
        display: none;
      }

      .progress-fields {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .progress-fields .field-label {
        display: inline;
        font-weight: 700;
        margin-right: 6px;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to Course Dashboard</a>
  <h1>A.S. SNHU Progress</h1>
  <p class="subtitle">All courses for the A.S. SNHU program</p>

  <div class="progress-table-header">
    <div>Course</div>
    <div>Units</div>
    <div>Amount Complete</div>
    <div>Date</div>
    <div>CourseSite</div>
    <div>Processed</div>
    <div>TimeCompletion</div>
  </div>

  <ul id="course-list" class="course-list"></ul>
  <div class="error" id="load-error"></div>

  <script>
    let pendingCourses = [];
    let activeCostButtons = new Set();
    let activeLengthButtons = new Set();

    function formatCourseMeta(units, course) {
      const college = course.college || "n/a";
      const transferoption = course.transferoption;
      const transferText = transferoption && transferoption !== "none"
        ? ` with ${transferoption}`
        : "";
      return `Units: ${units} · College: ${college}${transferText}`;
    }

    function getCourseCost(course) {
      if (!course || course.cost == null) return 0;
      const cost = Number(course.cost);
      const transferoption = course.transferoption;
      if (transferoption && transferoption !== "none") {
        const units = Number(course.unitsdone) || 0;
        return cost * units;
      }
      return cost;
    }

    function formatAmountComplete(value) {
      if (value == null || value === "") return "";
      return `${Number(value)}%`;
    }

    function formatTimeCompletion(months) {
      if (months == null || months === "") return "";
      const n = Number(months);
      if (Number.isNaN(n)) return "";
      return n === 1 ? "1 month" : `${n} months`;
    }

    function formatProcessed(value) {
      if (!value || value === "None") return "";
      return value;
    }

    function formatFieldCell(label, value) {
      const cell = document.createElement("div");
      cell.innerHTML = `<span class="field-label">${label}:</span>${value || ""}`;
      return cell;
    }

    function renderProgressFields(course) {
      const row = document.createElement("div");
      row.className = "progress-fields";

      const courseName = course.coursename || "Untitled course";
      const units = course.unitsdone != null ? course.unitsdone : "";
      const amountComplete = formatAmountComplete(course.amountComplete);
      const date = course.date || "";
      const courseSite = course.courseSite || "";
      const processed = formatProcessed(course.processed);
      const timeCompletion = formatTimeCompletion(course.timeCompletion);

      row.appendChild(formatFieldCell("Course", courseName));
      row.appendChild(formatFieldCell("Units", units));
      row.appendChild(formatFieldCell("Amount Complete", amountComplete));
      row.appendChild(formatFieldCell("Date", date));
      row.appendChild(formatFieldCell("CourseSite", courseSite));
      row.appendChild(formatFieldCell("Processed", processed));
      row.appendChild(formatFieldCell("TimeCompletion", timeCompletion));

      return row;
    }

    function renderCourses(courses) {
      const ul = document.getElementById("course-list");
      ul.innerHTML = "";
      pendingCourses = courses;

      courses.forEach((course, index) => {
        const li = document.createElement("li");
        li.className = "pending-item";

        const mainRow = document.createElement("div");
        mainRow.className = "pending-main-row";

        const mainDiv = document.createElement("div");
        mainDiv.className = "pending-main";

        const nameSpan = document.createElement("span");
        nameSpan.className = "course-name";
        nameSpan.textContent = course.coursename || "Untitled course";

        const metaDiv = document.createElement("div");
        metaDiv.className = "course-meta";
        const units = course.unitsdone != null ? course.unitsdone : "?";
        metaDiv.textContent = formatCourseMeta(units, course);

        mainDiv.appendChild(nameSpan);
        mainDiv.appendChild(metaDiv);
        mainRow.appendChild(mainDiv);

        const actionDiv = document.createElement("div");
        actionDiv.className = "pending-action";

        const costBtn = document.createElement("button");
        costBtn.className = "action-top";
        costBtn.textContent = "Cost";
        costBtn.dataset.courseIndex = index;
        costBtn.dataset.type = "cost";

        const lengthBtn = document.createElement("button");
        lengthBtn.className = "action-bottom";
        lengthBtn.textContent = "Length";
        lengthBtn.dataset.courseIndex = index;
        lengthBtn.dataset.type = "length";

        actionDiv.appendChild(costBtn);
        actionDiv.appendChild(lengthBtn);
        mainRow.appendChild(actionDiv);

        const expandDiv = document.createElement("div");
        expandDiv.id = "expand-" + index;
        expandDiv.className = "pending-expand open";

        const expandContent = document.createElement("div");
        expandContent.className = "pending-expand-content";
        expandContent.textContent = `More info: ${course.coursename || "Pending course"} - ${course.college || "N/A"} • Units: ${course.unitsdone || "?"}`;

        expandDiv.appendChild(expandContent);

        li.appendChild(mainRow);
        li.appendChild(expandDiv);
        li.appendChild(renderProgressFields(course));

        if (course.completed) {
          const completeBar = document.createElement("div");
          completeBar.className = "pending-complete-bar";
          completeBar.textContent = "Complete";
          li.appendChild(completeBar);
        }

        ul.appendChild(li);
      });

      attachSplitButtonListeners();
    }

    function handleSplitButtonClick(e) {
      const btn = e.currentTarget;
      const index = parseInt(btn.dataset.courseIndex, 10);
      const type = btn.dataset.type;
      const course = pendingCourses[index];

      if (!course) return;

      if (type === "cost") {
        if (btn.classList.contains("active")) {
          btn.textContent = "Cost";
          btn.classList.remove("active");
          activeCostButtons.delete(index);
        } else {
          const cost = course.cost ? `$${getCourseCost(course).toLocaleString()}` : "$TBD";
          btn.textContent = cost;
          btn.classList.add("active");
          activeCostButtons.add(index);
        }
      } else if (type === "length") {
        if (btn.classList.contains("active")) {
          btn.textContent = "Length";
          btn.classList.remove("active");
          activeLengthButtons.delete(index);
        } else {
          const length = course.length || course.duration || course.hours || "TBD";
          btn.textContent = length;
          btn.classList.add("active");
          activeLengthButtons.add(index);
        }
      }
    }

    function attachSplitButtonListeners() {
      document.querySelectorAll(".action-top").forEach((btn) => {
        btn.addEventListener("click", handleSplitButtonClick);
      });
      document.querySelectorAll(".action-bottom").forEach((btn) => {
        btn.addEventListener("click", handleSplitButtonClick);
      });
    }

    fetch("pending_snhu.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((courses) => {
        renderCourses(courses);
      })
      .catch((err) => {
        document.getElementById("load-error").textContent =
          `Could not load SNHU course data (${err.message})`;
      });
  </script>
</body>
</html>
